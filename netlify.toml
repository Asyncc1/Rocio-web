# Netlify configuration — https://rocioordonez.com
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "NITRO_PRESET=cloudflare-module bun run build && node scripts/prerender-static.mjs"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "cloudflare-module"
  LOVABLE_ASSET_SOURCE = "https://o-calm-space.lovable.app"
  
# ---------------------------------------------------------------------------
# Redirects (evaluated top-down: the first matching rule wins)
# ---------------------------------------------------------------------------

# Canonical host: the www subdomain and plain http point at the apex domain.
[[redirects]]
  from = "https://www.rocioordonez.com/*"
  to = "https://rocioordonez.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://rocioordonez.com/*"
  to = "https://rocioordonez.com/:splat"
  status = 301
  force = true

# Section shortcuts kept alive from earlier versions of the landing page.
[[redirects]]
  from = "/servicios"
  to = "/#servicios"
  status = 301
  force = true

[[redirects]]
  from = "/ubicacion"
  to = "/#ubicacion"
  status = 301
  force = true

[[redirects]]
  from = "/contacto"
  to = "/#contacto"
  status = 301
  force = true

[[redirects]]
  from = "/agenda"
  to = "/#agenda"
  status = 301
  force = true

# Every page is a real file in .output/public, so there is no single-page fallback:
# Netlify serves 404.html (generated by scripts/prerender-static.mjs) with a
# proper 404 status for anything that does not exist.

# ---------------------------------------------------------------------------
# Response headers
# ---------------------------------------------------------------------------

# Hashed build assets never change name, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
